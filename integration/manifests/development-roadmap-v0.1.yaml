change_impact:
  assessed_rules:
    - XDOM-MECH-SIM-001
    - XDOM-ELEC-MECH-001
  dispositions:
    XDOM-MECH-SIM-001:
      status: not_triggered
      basis: >-
        This revision defines development governance and future trade/prototype
        work. It does not change external geometry, mass, CG, fins, motor,
        recovery inputs, launcher inputs, or any flight-driving model value.
    XDOM-ELEC-MECH-001:
      status: not_triggered
      basis: >-
        This revision does not select or change electronics hardware, PCB,
        connector, cable, antenna, power-dissipation, or sensor-interface
        geometry. Future electronics prototypes remain subject to the rule.
