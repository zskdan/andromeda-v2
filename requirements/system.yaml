schema_version: 1
requirements:
  - id: SYS-RF-001
    statement: The vehicle-to-ground telemetry service shall be receivable throughout the nominal flight envelope.
    owner: rf_system
    verification_method: analysis_and_test
    status: defined
    threshold: TBD
  - id: SYS-VIDEO-001
    statement: The system shall deliver onboard camera video to the ground operator display.
    owner: video_system
    verification_method: end_to_end_test
    status: defined
    threshold: TBD
  - id: SYS-TC-001
    statement: The ground segment shall decode, display, and record vehicle telemetry.
    owner: telemetry_command
    verification_method: end_to_end_test
    status: defined
    threshold: TBD
  - id: SYS-TC-002
    statement: The ground segment shall validate and transmit authorized vehicle commands.
    owner: telemetry_command
    verification_method: end_to_end_test
    status: defined
    threshold: TBD
  - id: SYS-STRUCT-001
    statement: Vehicle geometry shall be mechanically compatible with the launcher.
    owner: structures_mechanisms
    verification_method: analysis_and_inspection
    status: defined
    threshold:
      airframe_outer_diameter_mm: 120.0
      provisional_design_wall_thickness_mm: 2.0
      derived_nominal_inner_diameter_mm: 116.0
      minimum_verified_clear_bore_mm: TBD
      values_status: provisional_pending_airframe_selection_and_measurement
  - id: SYS-LAUNCH-001
    statement: The vehicle shall use a rigid launch rail; a launch rod may be substituted only after analysis and fit testing demonstrate equivalent structural guidance, clearance, and departure-velocity performance.
    owner: structures_mechanisms
    verification_method: analysis_inspection_and_test
    status: defined
    threshold:
      baseline_interface: rail
      baseline_profile: 1515_or_equivalent
      minimum_effective_guide_length_mm: 4000
      guide_attachment_count: 2
      minimum_guide_attachment_separation_mm: 800
      alternate_rod_diameter_mm: TBD
      maximum_guide_deflection_mm: TBD
  - id: SYS-LAUNCH-002
    statement: The qualified flight configuration shall depart the launch guide at or above the minimum controllable departure velocity.
    owner: flight_dynamics
    verification_method: analysis_and_test
    status: defined
    threshold:
      minimum_departure_velocity_m_s: 20.0
  - id: SYS-FLIGHT-001
    statement: The complete configuration shall maintain the required flight stability margin.
    owner: flight_dynamics
    verification_method: analysis
    status: defined
    threshold: TBD
  - id: SYS-RECOVERY-001
    statement: The recovery system shall limit vehicle speed at main-parachute deployment to the qualified maximum.
    owner: flight_dynamics
    verification_method: analysis_and_test
    status: defined
    threshold:
      maximum_main_deployment_speed_m_s: 10.0
  - id: SYS-MASS-001
    statement: The integrated system shall maintain a controlled vehicle mass budget.
    owner: integrator
    verification_method: analysis_and_measurement
    status: defined
    threshold: TBD
